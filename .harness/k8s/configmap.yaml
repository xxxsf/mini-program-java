apiVersion: v1
kind: ConfigMap
metadata:
  name: invoicetool-config
data:
  # Database configuration
  spring.datasource.url: "jdbc:mysql://mysql-service:3306/invoicetool?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
  
  # JPA configuration
  spring.jpa.hibernate.ddl-auto: "update"
  spring.jpa.database-platform: "org.hibernate.dialect.MySQL8Dialect"
  spring.jpa.show-sql: "false"
  
  # Application configuration
  server.port: "8080"
  spring.application.name: "invoicetool"
  
  # Logging configuration
  logging.level.root: "INFO"
  logging.level.com.example.invoicetool: "DEBUG"