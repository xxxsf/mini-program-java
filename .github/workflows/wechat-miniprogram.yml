name: WeChat Mini Program CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'invoiceTool_miniProgram/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'invoiceTool_miniProgram/**'

jobs:
  # ============================================
  # 微信小程序代码结构和语法校验
  # ============================================
  validate-miniprogram:
    name: Validate Mini Program Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Validate project structure
        run: |
          cd invoiceTool_miniProgram
          
          # 检查必需文件
          required_files=("app.js" "app.json" "app.wxss")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Required file $file is missing"
              exit 1
            fi
          done
          
          # 检查页面目录
          if [ ! -d "pages" ]; then
            echo "❌ pages directory is missing"
            exit 1
          fi
          
          echo "✅ Project structure validation passed"
          
  # ============================================
  # Java 后端构建 (代码编译校验)
  # ============================================
  build-backend:
    name: Build Backend API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Build with Maven
        run: |
          cd invoiceTool_Java
          chmod +x mvnw
          ./mvnw clean package -DskipTests