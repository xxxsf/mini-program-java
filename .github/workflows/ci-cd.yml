name: InvoiceTool CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ============================================
  # Java 后端构建和编译校验
  # ============================================
  build-backend:
    name: Build Java Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'
          
      - name: Build with Maven
        run: |
          cd invoiceTool_Java
          chmod +x mvnw
          ./mvnw clean package -DskipTests
          
  # ============================================
  # 微信小程序构建校验
  # ============================================
  build-miniprogram:
    name: Build WeChat Mini Program
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Validate miniprogram structure
        run: |
          cd invoiceTool_miniProgram
          if [ ! -f app.json ]; then
            echo "Error: app.json not found"
            exit 1
          fi
          if [ ! -f app.js ]; then
            echo "Error: app.js not found"
            exit 1
          fi
          echo "✅ Mini program structure is valid"